name: Test Sphinx doc build

on:
  pull_request:
    branches:
    - gh-pages

jobs:
  run-checks:
    strategy:
      matrix:
        target: [html, check, linkcheck]
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        cache: pip
    - name: Install dependencies
      run: make install
    - name: Run checks
      run: make ${{ matrix.target }}
